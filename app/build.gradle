plugins { id 'com.android.application' }

android {
    namespace 'com.security.lab'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.security.lab'
        minSdk 24
        targetSdk 24
        versionCode 1
        versionName '1.0'
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
        ndk { abiFilters 'arm64-v8a','armeabi-v7a','x86_64' }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
}
